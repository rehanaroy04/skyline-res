<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Ticket — SkylineRes</title>
<style>
/* ============================================================
   style.css — Shared Styles for SkylineRes
   Theme: Dark navy + cyan (aviation control-panel inspired)
   ============================================================ */

:root {
  --navy-950: #060d1a;
  --navy-900: #0a1929;
  --navy-800: #0f2337;
  --navy-700: #16324a;
  --navy-600: #234460;
  --cyan: #00d4ff;
  --cyan-dim: #0aa8cc;
  --text-hi: #eaf3fb;
  --text-mid: #9fb3c8;
  --text-dim: #6b8299;
  --green: #33d69f;
  --red: #ff5d6c;
  --amber: #ffb648;
  --radius: 10px;
  --font-display: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(1200px 600px at 20% -10%, #0e2740 0%, var(--navy-950) 55%);
  color: var(--text-hi);
  font-family: var(--font-display);
  min-height: 100vh;
}

a { color: var(--cyan); text-decoration: none; }

/* ---------- Navbar ---------- */
#site-nav {
  border-bottom: 1px solid var(--navy-700);
  background: rgba(10, 25, 41, 0.85);
  backdrop-filter: blur(6px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.nav-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.brand {
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text-hi);
  letter-spacing: 0.02em;
}
.nav-toggle {
  display: none;
  margin-left: auto;
  background: none;
  border: 1px solid var(--navy-600);
  color: var(--text-hi);
  font-size: 1.1rem;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.nav-collapse {
  display: flex;
  align-items: center;
  gap: 24px;
  flex: 1;
  flex-wrap: wrap;
}
.nav-links { display: flex; gap: 18px; flex: 1; flex-wrap: wrap; }
.nav-link {
  color: var(--text-mid);
  font-size: 0.92rem;
  padding: 6px 2px;
  border-bottom: 2px solid transparent;
}
.nav-link.active, .nav-link:hover { color: var(--text-hi); border-color: var(--cyan); }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-user { color: var(--text-dim); font-size: 0.88rem; }
.nav-btn, .nav-btn-outline {
  border: none; cursor: pointer; font-family: inherit; font-size: 0.88rem;
}
.nav-btn { background: none; color: var(--red); }
.nav-btn-outline {
  border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 14px; border-radius: 6px; background: none;
}

/* ---------- Layout ---------- */
.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}
.page-narrow { max-width: 460px; }
.page-title { font-size: 1.6rem; margin-bottom: 6px; }
.page-subtitle { color: var(--text-mid); margin-bottom: 28px; }

/* ---------- Hero ---------- */
.hero {
  padding: 60px 24px 40px;
  text-align: center;
}
.hero h1 {
  font-size: 2.4rem;
  margin-bottom: 10px;
  background: linear-gradient(90deg, var(--text-hi), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p { color: var(--text-mid); max-width: 520px; margin: 0 auto 32px; }

/* ---------- Cards / panels ---------- */
.panel {
  background: var(--navy-900);
  border: 1px solid var(--navy-700);
  border-radius: var(--radius);
  padding: 28px;
}

/* ---------- Forms ---------- */
form { display: flex; flex-direction: column; gap: 14px; }
.field-row { display: flex; gap: 12px; }
.field-row > * { flex: 1; }
label { font-size: 0.82rem; color: var(--text-mid); margin-bottom: 4px; display: block; }
input, select {
  width: 100%;
  padding: 11px 13px;
  background: var(--navy-800);
  border: 1px solid var(--navy-600);
  border-radius: 7px;
  color: var(--text-hi);
  font-size: 0.94rem;
  font-family: inherit;
}
input:focus, select:focus { outline: 2px solid var(--cyan); border-color: var(--cyan); }
input::placeholder { color: var(--text-dim); }

.btn {
  padding: 11px 20px;
  border-radius: 7px;
  border: none;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.btn-primary { background: var(--cyan); color: var(--navy-950); }
.btn-primary:hover { background: var(--cyan-dim); }
.btn-primary:disabled { background: var(--navy-600); color: var(--text-dim); cursor: not-allowed; }
.btn-outline { background: none; border: 1px solid var(--cyan); color: var(--cyan); }
.btn-danger { background: none; border: 1px solid var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(255, 93, 108, 0.1); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }

.form-message {
  display: none;
  padding: 10px 12px;
  border-radius: 7px;
  font-size: 0.87rem;
}
.form-message.error { display: block; background: rgba(255, 93, 108, 0.12); color: var(--red); }
.form-message.success { display: block; background: rgba(51, 214, 159, 0.12); color: var(--green); }

.form-footer { text-align: center; color: var(--text-mid); font-size: 0.88rem; margin-top: 6px; }

/* ---------- Search / results ---------- */
.search-panel { max-width: 640px; margin: 0 auto; }
.results-summary { color: var(--text-mid); margin-bottom: 20px; }
.flight-card {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--navy-900); border: 1px solid var(--navy-700);
  border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px;
}
.flight-route { font-size: 1.05rem; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.flight-code { color: var(--cyan); font-size: 0.85rem; border: 1px solid var(--cyan); padding: 2px 8px; border-radius: 4px; }
.flight-meta { display: flex; gap: 16px; color: var(--text-mid); font-size: 0.85rem; margin-top: 6px; }
.flight-side { text-align: right; }
.flight-fare { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--cyan); }

.empty-state { color: var(--text-dim); text-align: center; padding: 40px 0; }

/* ---------- Seat map ---------- */
.seat-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin: 24px 0;
  max-width: 480px;
}
.seat {
  padding: 12px 0;
  border-radius: 6px;
  border: 1px solid var(--navy-600);
  background: var(--navy-800);
  color: var(--text-hi);
  cursor: pointer;
  font-size: 0.85rem;
  font-family: inherit;
}
.seat-taken { background: var(--navy-700); color: var(--text-dim); cursor: not-allowed; text-decoration: line-through; }
.seat-selected { background: var(--cyan); color: var(--navy-950); border-color: var(--cyan); font-weight: 700; }
.seat-legend { display: flex; gap: 20px; color: var(--text-mid); font-size: 0.85rem; margin-bottom: 6px; }

/* ---------- Booking summary ---------- */
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--navy-700); font-size: 0.92rem; }
.summary-row.total { font-weight: 700; font-size: 1.05rem; color: var(--cyan); border-bottom: none; }
.passenger-block { border: 1px solid var(--navy-700); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.passenger-block legend { color: var(--text-mid); font-size: 0.85rem; padding: 0 6px; }

.pay-methods { display: flex; gap: 12px; margin: 14px 0; }
.pay-methods label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--navy-600); padding: 10px 16px; border-radius: 7px; cursor: pointer; color: var(--text-hi); font-size: 0.88rem; }
.pay-methods input { width: auto; }

/* ---------- Ticket / confirmation ---------- */
.ticket-card { background: var(--navy-900); border: 1px solid var(--cyan); border-radius: var(--radius); padding: 32px; }
.ticket-header h2 { color: var(--green); margin-bottom: 4px; }
.ticket-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 22px 0; }
.passenger-list { color: var(--text-mid); font-size: 0.9rem; line-height: 1.7; }
.ticket-actions { display: flex; gap: 12px; margin-top: 20px; }
.muted { color: var(--text-dim); }

/* ---------- Booking history ---------- */
.booking-card {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--navy-900); border: 1px solid var(--navy-700);
  border-radius: var(--radius); padding: 18px 22px; margin-bottom: 12px;
}
.booking-status { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.status-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; text-transform: capitalize; }
.status-confirmed { background: rgba(51, 214, 159, 0.15); color: var(--green); }
.status-cancelled { background: rgba(255, 93, 108, 0.15); color: var(--red); }
.status-pending { background: rgba(255, 182, 72, 0.15); color: var(--amber); }

/* ---------- Admin ---------- */
.admin-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--navy-700); margin-bottom: 24px; }
.admin-tab {
  background: none; border: none; color: var(--text-mid); padding: 10px 18px;
  cursor: pointer; font-family: inherit; font-size: 0.9rem; border-bottom: 2px solid transparent;
}
.admin-tab.active { color: var(--cyan); border-color: var(--cyan); }
.admin-panel { display: none; }
.admin-panel.active { display: block; }
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table th, .admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--navy-700); font-size: 0.88rem; }
.admin-table th { color: var(--text-mid); font-weight: 600; }
.admin-grid { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
.customer-card { background: var(--navy-900); border: 1px solid var(--navy-700); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
.mini-list { color: var(--text-mid); font-size: 0.83rem; margin: 8px 0 0; padding-left: 18px; }
.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.report-stat { background: var(--navy-900); border: 1px solid var(--navy-700); border-radius: var(--radius); padding: 20px; text-align: center; }
.stat-value { display: block; font-size: 1.6rem; font-weight: 700; color: var(--cyan); }
.stat-label { color: var(--text-mid); font-size: 0.82rem; }

@media (max-width: 720px) {
  .nav-toggle { display: block; }
  .nav-collapse {
    display: none;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    gap: 14px;
    padding-top: 10px;
  }
  .nav-collapse.open { display: flex; }
  .nav-links { flex-direction: column; gap: 10px; }
  .nav-right { flex-direction: column; align-items: flex-start; gap: 10px; }

  .page { padding: 24px 16px 60px; }
  .hero { padding: 36px 16px 24px; }
  .hero h1 { font-size: 1.7rem; }

  .panel { padding: 20px; }
  .field-row { flex-direction: column; gap: 12px; }

  .admin-grid { grid-template-columns: 1fr; }
  .ticket-grid { grid-template-columns: 1fr; }
  .report-grid { grid-template-columns: repeat(2, 1fr); }

  .seat-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 100%; }
  .seat { padding: 10px 0; font-size: 0.8rem; }

  .flight-card {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
  }
  .flight-side { text-align: left; }
  .flight-side .btn { width: 100%; }
  .flight-meta { flex-wrap: wrap; gap: 10px; }

  .booking-card { flex-direction: column; align-items: stretch; gap: 12px; }
  .booking-status { align-items: flex-start; }

  .pay-methods { flex-direction: column; }
  .ticket-actions { flex-direction: column; }
  .ticket-actions .btn { width: 100%; text-align: center; }

  .admin-table { display: block; overflow-x: auto; white-space: nowrap; }

  input, select, .btn { font-size: 16px; } /* prevents iOS auto-zoom on focus */
}

@media (max-width: 420px) {
  .report-grid { grid-template-columns: 1fr 1fr; }
  .seat-grid { grid-template-columns: repeat(5, 1fr); }
}

@media print {
  #site-nav, .ticket-actions { display: none; }
  body { background: white; color: black; }
  .ticket-card { border-color: black; }
}

.view { display: none; }
</style>
</head>
<body>
<nav id="site-nav"></nav>


<div id="view-book" class="view"><div class="page">
  <h1 class="page-title">Complete Your Booking</h1>

  <div class="panel" style="margin-bottom:20px">

  </div>
</div></div>
<div id="view-confirm" class="view"><div class="page">
  <div id="confirmation-content"></div>
</div></div>


<script>
/* ============================================================
   BOOKING MODULE — Passenger details (UC8), Payment (UC9), Invoice (UC10), E-ticket & email (UC11)
   Self-contained module file: HTML + CSS + JS in one place.
   Bundles the shared CORE (data layer + navbar) so this file
   is fully functional once it's sitting next to the other
   module .html files in the same folder.
   ============================================================ */

/* ---- CORE MODULE: data.js (shared localStorage data layer) ---- */
/* ============================================================
   data.js — Shared Data Layer
   Module: CORE (used by all other modules)
   Simulates a backend using localStorage so the whole app
   runs as a static front-end (no server required).
   ============================================================ */

const DB_KEYS = {
  USERS: "ars_users",
  FLIGHTS: "ars_flights",
  BOOKINGS: "ars_bookings",
  SESSION: "ars_session",
  SEED_VERSION: "ars_seed_version",
};

// Bump this whenever the generated flight schedule changes shape, so
// anyone who already has the app open picks up the new data automatically.
const CURRENT_SEED_VERSION = "2";

const ROUTES = [
  { source: "Chennai", destination: "Delhi", depart: "06:30", arrive: "09:10", fare: 4500 },
  { source: "Delhi", destination: "Chennai", depart: "19:30", arrive: "22:15", fare: 4700 },
  { source: "Chennai", destination: "Mumbai", depart: "11:00", arrive: "13:00", fare: 3800 },
  { source: "Mumbai", destination: "Chennai", depart: "17:20", arrive: "19:25", fare: 3900 },
  { source: "Bengaluru", destination: "Delhi", depart: "08:15", arrive: "11:00", fare: 5200 },
  { source: "Delhi", destination: "Bengaluru", depart: "14:00", arrive: "16:45", fare: 5100 },
  { source: "Mumbai", destination: "Kolkata", depart: "15:45", arrive: "18:20", fare: 4100 },
  { source: "Kolkata", destination: "Mumbai", depart: "07:00", arrive: "09:35", fare: 4050 },
  { source: "Chennai", destination: "Bengaluru", depart: "09:00", arrive: "10:00", fare: 1800 },
  { source: "Bengaluru", destination: "Chennai", depart: "18:30", arrive: "19:30", fare: 1750 },
  { source: "Delhi", destination: "Hyderabad", depart: "10:20", arrive: "12:35", fare: 4300 },
  { source: "Hyderabad", destination: "Delhi", depart: "20:00", arrive: "22:15", fare: 4400 },
  { source: "Mumbai", destination: "Goa", depart: "12:10", arrive: "13:20", fare: 2600 },
  { source: "Goa", destination: "Mumbai", depart: "16:00", arrive: "17:10", fare: 2500 },
  { source: "Chennai", destination: "Kolkata", depart: "13:30", arrive: "15:50", fare: 4200 },
  { source: "Pune", destination: "Delhi", depart: "05:45", arrive: "08:10", fare: 4600 },
];

function pad(n) {
  return String(n).padStart(2, "0");
}

function toDateString(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/* Generates flights for today + the next 13 days, cycling through the
   ROUTES list so every route appears several times across the window.
   This guarantees a search for almost any common city pair / near-term
   date returns real results instead of "no flights found". */
function generateFlightSchedule() {
  const flights = [];
  const today = new Date();
  let flightCounter = 100;

  for (let dayOffset = 0; dayOffset < 14; dayOffset++) {
    const day = new Date(today);
    day.setDate(today.getDate() + dayOffset);
    const dateStr = toDateString(day);

    // 4 routes per day, rotating through the full route list
    for (let i = 0; i < 4; i++) {
      const route = ROUTES[(dayOffset * 4 + i) % ROUTES.length];
      flightCounter++;
      flights.push({
        id: "FL-" + flightCounter,
        number: "SK" + flightCounter,
        source: route.source,
        destination: route.destination,
        date: dateStr,
        departTime: route.depart,
        arriveTime: route.arrive,
        fare: route.fare,
        seatCapacity: 30,
      });
    }
  }
  return flights;
}

function seedDatabase() {
  if (!localStorage.getItem(DB_KEYS.USERS)) {
    const users = [
      {
        id: "u-admin",
        role: "admin",
        name: "System Admin",
        email: "admin@skyline.com",
        phone: "9999999999",
        password: "admin123",
      },
    ];
    localStorage.setItem(DB_KEYS.USERS, JSON.stringify(users));
  }

  const seedVersion = localStorage.getItem(DB_KEYS.SEED_VERSION);
  const needsFreshFlights = !localStorage.getItem(DB_KEYS.FLIGHTS) || seedVersion !== CURRENT_SEED_VERSION;

  if (needsFreshFlights) {
    localStorage.setItem(DB_KEYS.FLIGHTS, JSON.stringify(generateFlightSchedule()));
    localStorage.setItem(DB_KEYS.BOOKINGS, JSON.stringify([])); // old bookings would reference stale flight ids
    localStorage.setItem(DB_KEYS.SEED_VERSION, CURRENT_SEED_VERSION);
  }

  if (!localStorage.getItem(DB_KEYS.BOOKINGS)) {
    localStorage.setItem(DB_KEYS.BOOKINGS, JSON.stringify([]));
  }
}

/* Generic CRUD helpers */
const DB = {
  getUsers: () => JSON.parse(localStorage.getItem(DB_KEYS.USERS) || "[]"),
  saveUsers: (list) => localStorage.setItem(DB_KEYS.USERS, JSON.stringify(list)),

  getFlights: () => JSON.parse(localStorage.getItem(DB_KEYS.FLIGHTS) || "[]"),
  saveFlights: (list) => localStorage.setItem(DB_KEYS.FLIGHTS, JSON.stringify(list)),

  getBookings: () => JSON.parse(localStorage.getItem(DB_KEYS.BOOKINGS) || "[]"),
  saveBookings: (list) => localStorage.setItem(DB_KEYS.BOOKINGS, JSON.stringify(list)),

  getSession: () => JSON.parse(localStorage.getItem(DB_KEYS.SESSION) || "null"),
  setSession: (session) => localStorage.setItem(DB_KEYS.SESSION, JSON.stringify(session)),
  clearSession: () => localStorage.removeItem(DB_KEYS.SESSION),
};

function bookedSeatsForFlight(flightId) {
  return DB.getBookings()
    .filter((b) => b.flightId === flightId && b.status !== "cancelled")
    .flatMap((b) => b.seats);
}

function generateId(prefix) {
  return prefix + "-" + Date.now().toString(36) + Math.floor(Math.random() * 1000);
}

function formatCurrency(amount) {
  return "₹" + Number(amount).toLocaleString("en-IN");
}

seedDatabase();


/* ---- CORE MODULE: nav.js (shared navbar + route guards) ---- */
/* ============================================================
   nav.js — Shared Navigation
   Module: CORE
   Renders the top navbar based on current session and
   provides simple route-guard helpers.
   ============================================================ */

function renderNavbar(activePage) {
  const session = DB.getSession();
  const navEl = document.getElementById("site-nav");
  if (!navEl) return;

  const links = [
    { href: "flights.html", label: "Search Flights", key: "search" },
    { href: "history.html", label: "My Bookings", key: "history" },
  ];

  let rightSide = "";
  if (session) {
    rightSide = `
      <span class="nav-user">Hi, ${session.name.split(" ")[0]}</span>
      ${session.role === "admin" ? '<a href="admin.html" class="nav-link">Admin Panel</a>' : ""}
      <a href="auth.html?view=profile" class="nav-link">Profile</a>
      <button id="logout-btn" class="nav-link nav-btn">Logout</button>
    `;
  } else {
    rightSide = `
      <a href="auth.html?view=login" class="nav-link">Login</a>
      <a href="auth.html?view=register" class="nav-link nav-btn-outline">Sign Up</a>
    `;
  }

  navEl.innerHTML = `
    <div class="nav-inner">
      <a href="flights.html" class="brand">✈ SkylineRes</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <div class="nav-collapse" id="nav-collapse">
        <div class="nav-links">
          ${links
            .map(
              (l) =>
                `<a href="${l.href}" class="nav-link ${activePage === l.key ? "active" : ""}">${l.label}</a>`
            )
            .join("")}
        </div>
        <div class="nav-right">${rightSide}</div>
      </div>
    </div>
  `;

  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", () => {
      DB.clearSession();
      window.location.href = "flights.html";
    });
  }

  const toggleBtn = document.getElementById("nav-toggle");
  const collapse = document.getElementById("nav-collapse");
  if (toggleBtn && collapse) {
    toggleBtn.addEventListener("click", () => {
      const isOpen = collapse.classList.toggle("open");
      toggleBtn.setAttribute("aria-expanded", String(isOpen));
      toggleBtn.textContent = isOpen ? "✕" : "☰";
    });
  }
}

function requireLogin() {
  const session = DB.getSession();
  if (!session) {
    window.location.href = "auth.html?view=login";
    return null;
  }
  return session;
}

function requireAdmin() {
  const session = DB.getSession();
  if (!session || session.role !== "admin") {
    window.location.href = "auth.html?view=login";
    return null;
  }
  return session;
}


/* ---- Simple view router (shows one section based on ?view=) ---- */
function getView(defaultView) {
  return new URLSearchParams(window.location.search).get("view") || defaultView;
}
function showView(viewId) {
  document.querySelectorAll(".view").forEach((v) => (v.style.display = "none"));
  const el = document.getElementById(viewId);
  if (el) el.style.display = "block";
}

/* ---- booking.js ---- */
/* ============================================================
   booking.js — Booking, Payment, Invoice & E-Ticket Module
   Covers Use Cases: 8 (Book ticket + passenger details),
                      9 (Make online payment),
                      10 (Generate invoice),
                      11 (Generate e-ticket + email confirmation)
   ============================================================ */

/* UC8: passenger details form, built dynamically per selected seat */
function initBookPage() {
  const passengerFields = document.getElementById("passenger-fields");
  if (!passengerFields) return;
  const session = requireLogin();
  if (!session) return;

  const params = new URLSearchParams(window.location.search);
  const flightId = params.get("flight");
  const seats = (params.get("seats") || "").split(",").filter(Boolean);
  const flight = DB.getFlights().find((f) => f.id === flightId);

  if (!flight || seats.length === 0) {
    document.getElementById("book-summary").innerHTML = `<p class="empty-state">Invalid booking request.</p>`;
    return;
  }

  document.getElementById("book-summary").innerHTML = `
    <div class="summary-row"><span>Flight</span><span>${flight.number} (${flight.source} → ${flight.destination})</span></div>
    <div class="summary-row"><span>Date</span><span>${flight.date}, ${flight.departTime}</span></div>
    <div class="summary-row"><span>Seats</span><span>${seats.join(", ")}</span></div>
    <div class="summary-row total"><span>Total Fare</span><span>${formatCurrency(flight.fare * seats.length)}</span></div>
  `;

  passengerFields.innerHTML = seats
    .map(
      (seat, i) => `
    <fieldset class="passenger-block">
      <legend>Passenger ${i + 1} — Seat ${seat}</legend>
      <input type="text" placeholder="Full name" data-role="p-name" required />
      <div class="field-row">
        <input type="number" placeholder="Age" data-role="p-age" min="1" max="120" required />
        <select data-role="p-gender" required>
          <option value="">Gender</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
      <input type="text" placeholder="ID / Passport number" data-role="p-id" required />
    </fieldset>`
    )
    .join("");

  const form = document.getElementById("book-form");
  form.addEventListener("submit", (e) => {
    e.preventDefault();

    // UC8: validate + collect passenger details (Exception 8.0)
    const blocks = passengerFields.querySelectorAll(".passenger-block");
    const passengers = [];
    for (const block of blocks) {
      const name = block.querySelector('[data-role="p-name"]').value.trim();
      const age = block.querySelector('[data-role="p-age"]').value;
      const gender = block.querySelector('[data-role="p-gender"]').value;
      const idNum = block.querySelector('[data-role="p-id"]').value.trim();
      if (!name || !age || !gender || !idNum) {
        showFormMessage("book-msg", "Please complete all passenger details.");
        return;
      }
      passengers.push({ name, age, gender, idNumber: idNum });
    }

    // Exception 8.1: re-check seat availability right before confirming
    const stillTaken = new Set(bookedSeatsForFlight(flight.id));
    if (seats.some((s) => stillTaken.has(s))) {
      showFormMessage("book-msg", "One of your selected seats was just booked by someone else. Please reselect.");
      return;
    }

    // Create a pending booking (post-condition of UC8)
    const booking = {
      id: generateId("bk"),
      flightId: flight.id,
      userId: session.id,
      seats,
      passengers,
      fare: flight.fare * seats.length,
      status: "pending_payment",
      createdAt: new Date().toISOString(),
      paymentStatus: null,
      invoice: null,
    };
    const bookings = DB.getBookings();
    bookings.push(booking);
    DB.saveBookings(bookings);

    // Move on to the payment step (UC9), keep in same page via a "pay" panel
    document.getElementById("book-form-panel").style.display = "none";
    document.getElementById("payment-panel").style.display = "block";
    document.getElementById("pay-amount").textContent = formatCurrency(booking.fare);
    document.getElementById("pay-btn").onclick = () => processPayment(booking.id);
  });
}

/* UC9: Make online payment (simulated Payment Gateway) */
function processPayment(bookingId) {
  const payBtn = document.getElementById("pay-btn");
  const method = document.querySelector('input[name="pay-method"]:checked');
  if (!method) {
    showFormMessage("pay-msg", "Select a payment method.");
    return;
  }

  payBtn.disabled = true;
  payBtn.textContent = "Processing…";

  // Simulated Payment Gateway round-trip
  setTimeout(() => {
    const bookings = DB.getBookings();
    const booking = bookings.find((b) => b.id === bookingId);
    if (!booking) return;

    // Simulated 90% success rate to demonstrate Exception 9.0
    const success = Math.random() > 0.1;

    if (!success) {
      booking.paymentStatus = "failed";
      DB.saveBookings(bookings);
      showFormMessage("pay-msg", "Payment declined by gateway. Booking kept pending — please retry.");
      payBtn.disabled = false;
      payBtn.textContent = "Retry Payment";
      return;
    }

    booking.paymentStatus = "success";
    booking.status = "confirmed";
    booking.invoice = generateInvoice(booking); // UC10
    booking.eTicket = generateETicket(booking); // UC11
    DB.saveBookings(bookings);

    window.location.href = `booking.html?view=confirm&booking=${booking.id}`;
  }, 1200);
}

/* UC10: Generate invoice */
function generateInvoice(booking) {
  const taxRate = 0.05;
  const tax = Math.round(booking.fare * taxRate);
  return {
    invoiceNo: generateId("INV"),
    date: new Date().toISOString(),
    fare: booking.fare,
    tax,
    total: booking.fare + tax,
    paymentRef: generateId("PAY"),
  };
}

/* UC11: Generate e-ticket + simulated email confirmation */
function generateETicket(booking) {
  return {
    ticketNo: generateId("ETK"),
    issuedAt: new Date().toISOString(),
    emailed: true, // simulated; Exception 11.0 handled by always allowing manual download below
  };
}

/* Confirmation page: renders invoice + e-ticket (UC10 / UC11 output) */
function initConfirmationPage() {
  const el = document.getElementById("confirmation-content");
  if (!el) return;
  const session = requireLogin();
  if (!session) return;

  const params = new URLSearchParams(window.location.search);
  const booking = DB.getBookings().find((b) => b.id === params.get("booking"));
  if (!booking || booking.status !== "confirmed") {
    el.innerHTML = `<p class="empty-state">Booking not found or not confirmed.</p>`;
    return;
  }
  const flight = DB.getFlights().find((f) => f.id === booking.flightId);

  el.innerHTML = `
    <div class="ticket-card">
      <div class="ticket-header">
        <h2>Booking Confirmed ✓</h2>
        <p class="muted">A confirmation email with your e-ticket has been sent (simulated).</p>
      </div>
      <div class="ticket-grid">
        <div><span class="muted">E-Ticket No.</span><br>${booking.eTicket.ticketNo}</div>
        <div><span class="muted">Flight</span><br>${flight.number} · ${flight.source} → ${flight.destination}</div>
        <div><span class="muted">Date / Time</span><br>${flight.date}, ${flight.departTime}</div>
        <div><span class="muted">Seats</span><br>${booking.seats.join(", ")}</div>
      </div>
      <h3>Passengers</h3>
      <ul class="passenger-list">
        ${booking.passengers.map((p) => `<li>${p.name} — Age ${p.age}, ${p.gender}, ID: ${p.idNumber}</li>`).join("")}
      </ul>
      <h3>Invoice</h3>
      <div class="summary-row"><span>Invoice No.</span><span>${booking.invoice.invoiceNo}</span></div>
      <div class="summary-row"><span>Fare</span><span>${formatCurrency(booking.invoice.fare)}</span></div>
      <div class="summary-row"><span>Tax (5%)</span><span>${formatCurrency(booking.invoice.tax)}</span></div>
      <div class="summary-row total"><span>Total Paid</span><span>${formatCurrency(booking.invoice.total)}</span></div>
      <div class="ticket-actions">
        <button class="btn btn-primary" onclick="window.print()">Download / Print Ticket</button>
        <a class="btn btn-outline" href="history.html">View My Bookings</a>
      </div>
    </div>
  `;
}


/* ---- Boot ---- */

renderNavbar();
const bookingView = getView("book");
showView("view-" + bookingView);
if (bookingView === "book") initBookPage();
if (bookingView === "confirm") initConfirmationPage();

</script>
